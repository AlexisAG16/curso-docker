version: '3.8'

services:
  # Servicio 1: Tu app de Python (Hito 2)
  app:
    build: .
    volumes:
      - ./logs:/app/logs

  # Servicio 2: Servidor Web para ver los logs
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./logs:/usr/share/nginx/html/logs
    # Esto es para que Nginx nos deje ver la lista de archivos
    command: /bin/sh -c "sed -i 's/index  index.html index.htm;/autoindex on;/' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"